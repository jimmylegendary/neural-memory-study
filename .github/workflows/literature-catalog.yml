name: Literature catalogue

on:
  workflow_dispatch:
  push:
    branches: [main, research/paper-db-2026-10-12]
    paths: [literature/BUILD_REQUEST]

permissions:
  contents: write

concurrency:
  group: literature-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalogue:
    if: github.repository == 'jimmylegendary/neural-memory-study'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Assemble readable source files on initial publication
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          parts = Path('literature/tools/build_parts')
          if parts.exists():
              files = sorted(parts.glob('*.pyfrag'))
              if [x.name for x in files] != ['01.pyfrag','02.pyfrag','03.pyfrag','04.pyfrag']:
                  raise SystemExit('Incomplete source assembly')
              source = ''.join(p.read_text(encoding='utf-8') for p in files)
              compile(source, 'build_catalog.py', 'exec')
              Path('literature/tools/build_catalog.py').write_text(source, encoding='utf-8')
              for p in files:
                  p.unlink()
              parts.rmdir()
          PY
          if [ ! -f literature/inputs/task_bibliography.tsv ]; then
            python3 literature/tools/seed_task.py
          fi
          python3 literature/tools/seed_metadata.py
      - name: Build and check catalogue
        shell: bash
        run: |
          python3 -m unittest discover -s literature/tests -v
          python3 literature/tools/build_catalog.py --online --deadline 780 --as-of 2026-10-12
          python3 literature/tools/check_catalog.py
      - name: Save validated catalogue
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- literature README.md
          if ! git diff --cached --quiet; then
            git commit -m 'data: build chronological paper database and coverage audit'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload catalogue package
        uses: actions/upload-artifact@v4
        with:
          name: neural-memory-paper-database
          path: literature/
          retention-days: 30
