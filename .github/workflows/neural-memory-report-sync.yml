name: Neural memory report publication
on:
  push:
    branches:
      - sync/neural-memory-report-2026-10-06
    paths:
      - .github/workflows/neural-memory-report-sync.yml
      - .report-sync-2026-10-06/**
permissions:
  contents: read
concurrency:
  group: neural-memory-report-publication-2026-10-06
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    container: python:3.13-trixie@sha256:31c98dca49ae8c0385ad1064cfb06b34e9d3cd60f1de047642a22a5661c76db4
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout publication branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: sync/neural-memory-report-2026-10-06
          fetch-depth: 1
          sparse-checkout: |
            .report-sync-2026-10-06
            deliverables/neural-memory/reports/2026-10-06-sleep-time-compute
      - name: Install verified rendering environment
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends fonts-nanum libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfontconfig1 git
          python -m pip install --no-cache-dir weasyprint==68.0 pydyf==0.12.1 cffi==2.0.0 pycparser==3.0 tinyhtml5==2.1.0 tinycss2==1.5.1 cssselect2==0.9.0 Pyphen==0.17.2 Pillow==12.3.0 fonttools==4.63.0 Brotli==1.2.0 zopfli==0.4.2 webencodings==0.5.1 PyMuPDF==1.26.7
      - name: Rebuild and verify approved PDF
        run: python .report-sync-2026-10-06/publish_ci.py
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-memory-report-2026-10-06
          path: deliverables/neural-memory/reports/2026-10-06-sleep-time-compute/
          retention-days: 7
          if-no-files-found: warn
      - name: Commit verified deliverables to publication branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md deliverables/neural-memory/reports/2026-10-06-sleep-time-compute/
          git diff --cached --stat
          git commit -m 'docs: publish verified 49-page neural memory PDF and editable source'
          git push origin HEAD:refs/heads/sync/neural-memory-report-2026-10-06
